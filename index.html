<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Bisnis All-in-One</title>
    
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 15px; background: #f0f2f5; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 25px; }
        .header h2 { color: #1a73e8; }
        
        .btn-main { 
            width: 100%; padding: 18px; background: #1a73e8; color: white; border: none; 
            border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer;
        }

        #status { text-align: center; margin: 15px 0; font-weight: 500; color: #f39c12; }

        .table-wrapper { margin-top: 20px; overflow-x: auto; border: 1px solid #ddd; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; background: #fff; font-size: 13px; }
        th, td { border-bottom: 1px solid #eee; padding: 12px; text-align: left; }
        th { background: #f8f9fa; }

        .controls { display: flex; gap: 10px; margin-top: 25px; }
        .btn-excel { background: #28a745; flex: 2; color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-del { background: #dc3545; flex: 1; color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        #preview-canvas { display: none; width: 100%; max-width: 200px; margin: 10px auto; border: 1px solid #ccc; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Scanner Bisnis Pro</h2>
        <p>Support: Kamera, Gambar (JPG/PNG), & PDF</p>
    </div>

    <canvas id="preview-canvas"></canvas>

    <input type="file" id="file-input" accept="image/*,application/pdf" style="display: none;">
    
    <button class="btn-main" onclick="document.getElementById('file-input').click()">
        📂 UPLOAD / SCAN DOKUMEN
    </button>
    
    <div id="status">Siap memproses...</div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Data Per Kolom</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <div class="controls">
        <button class="btn-excel" onclick="exportToExcel()">📊 DOWNLOAD EXCEL</button>
        <button class="btn-del" onclick="resetTable()">🗑️ RESET</button>
    </div>
</div>

<script>
    // Konfigurasi PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    let finalData = [];
    const fileInput = document.getElementById('file-input');
    const statusDiv = document.getElementById('status');
    const tableBody = document.getElementById('table-body');
    const canvas = document.getElementById('preview-canvas');

    fileInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        statusDiv.innerHTML = "⏳ Membaca file...";

        if (file.type === "application/pdf") {
            processPDF(file);
        } else {
            processImage(file);
        }
    };

    // Fungsi untuk memproses Gambar
    function processImage(source) {
        statusDiv.innerHTML = "⏳ OCR sedang bekerja...";
        Tesseract.recognize(source, 'ind').then(({ data: { text } }) => {
            handleTextExtraction(text);
        });
    }

    // Fungsi untuk memproses PDF (Halaman Pertama)
    async function processPDF(file) {
        const reader = new FileReader();
        reader.onload = async function() {
            const typedarray = new Uint8Array(this.result);
            const pdf = await pdfjsLib.getDocument(typedarray).promise;
            const page = await pdf.getPage(1); // Ambil halaman 1
            
            const viewport = page.getViewport({ scale: 2 });
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            await page.render({ canvasContext: context, viewport: viewport }).promise;
            
            // Ubah canvas menjadi data gambar untuk Tesseract
            processImage(canvas.toDataURL());
        };
        reader.readAsArrayBuffer(file);
    }

    // Logika pemisahan kolom
    function handleTextExtraction(text) {
        const lines = text.split('\n').filter(line => line.trim().length > 0);
        lines.forEach(line => {
            const columns = line.trim().split(/\s+/); 
            finalData.push(columns);
        });
        renderTable();
        statusDiv.innerHTML = "✅ Berhasil ditambahkan!";
    }

    function renderTable() {
        tableBody.innerHTML = "";
        finalData.forEach((row, index) => {
            let cells = row.map(col => `<td>${col}</td>`).join('');
            tableBody.innerHTML += `<tr><td>${index + 1}</td>${cells}</tr>`;
        });
    }

    function exportToExcel() {
        if (finalData.length === 0) return alert("Data kosong!");
        const ws = XLSX.utils.aoa_to_sheet(finalData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Rekap");
        XLSX.writeFile(wb, "Rekap_All_Files.xlsx");
    }

    function resetTable() {
        if(confirm("Hapus data?")) {
            finalData = [];
            tableBody.innerHTML = "";
            statusDiv.innerHTML = "Bersih.";
        }
    }
</script>

</body>
</html>
